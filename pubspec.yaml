name: recipes_recommender
description: A recipe recommendation web app using K-Means clustering.
publish_to: 'none'
version: 1.0.0

environment:
  sdk: ^3.7.2

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  shared_preferences: ^2.2.0

flutter:
  uses-material-design: true
  assets:
    - assets/recipes_short.json
    - assets/recipes_with_clusters.json
    - assets/ingredients_short.json
    - assets/ingredients_rev_short.json

